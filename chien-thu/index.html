<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chiến Thú Offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: single-screen mobile game shell — resource bar, one panel, bottom tabs; battle and pinball take over the screen. Deliberately dark-only. */
:root{
  --bg:#13101c; --panel:#1e1a2c; --panel2:#2a2440; --line:#3a3356;
  --ink:#f3eeff; --muted:#a39bc2; --gold:#ffc94a; --gem:#7ee0ff; --bad:#ff5d73; --good:#5fe39a;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;margin:0;
  background-image:radial-gradient(ellipse at 50% -10%,#2b2050 0,transparent 60%);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 88px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.logo{font-size:24px;font-weight:800}
.logo small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.res{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;font-size:13px}
.chip i{font-style:normal;width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip.g i{background:var(--gold)} .chip.d i{background:var(--gem);border-radius:2px;transform:rotate(45deg)}
.chip.b i{background:linear-gradient(#ff5d73 50%,#fff 50%);box-shadow:0 0 0 1px #0006}
.chip.t i{background:#c58cff;border-radius:2px}
.panel{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0f0c18ee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;backdrop-filter:blur(6px)}
.tabs button{flex:1;max-width:150px;padding:12px 2px;font-weight:700;color:var(--muted);font-size:12px;border-top:3px solid transparent}
.tabs button.on{color:var(--ink);border-top-color:var(--gold)}
.btn{background:var(--gold);color:#2a1d00;font-weight:800;border-radius:12px;padding:10px 16px;font-family:var(--display);font-size:16px;box-shadow:0 3px 0 #b8861d}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8861d}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 #120f1d}
.btn.red{background:var(--bad);color:#fff;box-shadow:0 3px 0 #9b2738}
.btn.sm{font-size:13px;padding:7px 11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{background:linear-gradient(135deg,#2c4a2a,#1b1630 70%);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero.endless{background:linear-gradient(135deg,#4a2230,#1b1630 70%)}
.hero.pin{background:linear-gradient(135deg,#3a2466,#1b1630 70%)}
.hero .num{font-family:var(--display);font-size:42px;font-weight:800;line-height:1}
.hero .num span{font-size:15px;color:var(--muted);font-weight:600}
.foes{display:flex;gap:6px;flex-wrap:wrap}
.zt{background:#0007;border-radius:10px;padding:4px 9px;font-size:12px;display:flex;gap:6px;align-items:center}
.zt b{font-size:18px;font-weight:400}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.node{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.node.done{background:#203a2e;border-color:#2f6b4c;color:var(--good)}
.node.cur{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.node.boss{border-width:2px;border-color:var(--bad)}
.daily{background:#2d2547;border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff3,transparent 55%),var(--ec,#555);box-shadow:inset 0 -4px 0 #0004}
.stars{color:var(--gold);font-size:11px;letter-spacing:1px}
.rar{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--rc);color:#120f1d}
.eltag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--ec);color:var(--ec)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;text-align:left;position:relative;min-width:0}
.card .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.card .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.sel{outline:2px solid var(--gold)}
.card.locked .ava{filter:grayscale(1) brightness(.5)} .card.locked .nm{color:var(--muted)}
.card .inteam{position:absolute;top:6px;right:8px;font-size:10px;font-weight:800;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{border:2px dashed var(--line);border-radius:14px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;text-align:center;min-width:0}
.slot.full{border-style:solid;border-color:#4a4170;background:var(--panel);color:var(--ink)}
.slot .ava{width:42px;height:42px;font-size:24px}
.slot b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.skill{background:#0005;border-radius:10px;padding:10px;line-height:1.5}
.skill b{color:var(--gold)}
.wheel{font-size:12px;color:var(--muted);line-height:1.6}
.altar{background:radial-gradient(circle at 50% 40%,#4b2f86,#1b1630 70%);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.rates{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pull{background:var(--panel);border:2px solid var(--rc);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;text-align:center;animation:pop .45s both;min-width:0}
.pull .ava{width:42px;height:42px;font-size:24px}
.pull .tag{font-weight:800;color:var(--good)}
@keyframes pop{from{transform:scale(.3) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mod .t{font-weight:700} .mod .sub{font-size:12px}
.sw{width:48px;height:28px;border-radius:999px;background:var(--panel2);position:relative;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw.on{background:#3a8f63} .sw.on::after{left:23px;background:#fff}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;flex:none}
.seg button{padding:5px 9px;border-radius:8px;font-weight:700;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#2a1d00}
input[type=number]{width:80px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:6px 8px;font:inherit}
.modbadge{font-size:10px;font-weight:800;background:var(--bad);color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:1px}
.confirm{background:#3a1622;border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#2a1d00;font-weight:800;padding:10px 16px;border-radius:12px;z-index:50;box-shadow:0 6px 20px #0008;animation:pop .3s both;max-width:calc(100% - 32px);text-align:center}

/* full-screen modes */
.arena{position:fixed;inset:0;z-index:10;background:#0c0914;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(8px + env(safe-area-inset-bottom,0px))}
.bhud{display:flex;align-items:center;gap:10px;max-width:520px;width:100%;margin:0 auto}
.bhud .bl{display:flex;flex-direction:column;line-height:1.15;flex:none}
.bhud .bl b{font-family:var(--display);font-size:17px}
.bhud .bl span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wallbar{flex:1;height:18px;background:#000a;border-radius:9px;position:relative;overflow:hidden;border:1px solid var(--line);min-width:0}
.wallbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c0503a,#e8a04a);transition:width .2s}
.wallbar span{position:relative;font-size:11px;font-weight:700;display:block;text-align:center;line-height:16px;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.bgold{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
.cv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cv canvas{border-radius:14px;display:block;touch-action:none}
.skills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sk{width:58px;height:58px;border-radius:50%;padding:4px;background:conic-gradient(var(--gem) calc(var(--p)*1%),#2a2440 0);position:relative;flex:none}
.sk .in{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,#fff3,transparent 55%),var(--ec)}
.sk.ready{box-shadow:0 0 16px #7ee0ffaa;animation:pulse 1s infinite}
.sk:not(.ready) .in{filter:saturate(.4) brightness(.75)}
@keyframes pulse{50%{transform:scale(1.06)}}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.over{position:absolute;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:3}
.over .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%}
.over h2{font-size:34px}
.buffs{display:flex;flex-direction:column;gap:8px}
.buff{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.buff:hover,.buff:focus-visible{border-color:var(--gold)}
.buff b{font-family:var(--display);font-size:17px;color:var(--gold)}
.flip{display:flex;gap:10px;justify-content:center}
.flip button{flex:1;max-width:170px;height:64px;border-radius:16px;background:var(--panel2);font-family:var(--display);font-size:18px;font-weight:800;box-shadow:0 4px 0 #0c0914;user-select:none;-webkit-user-select:none;touch-action:none}
.flip button.on{background:var(--gold);color:#2a1d00;transform:translateY(3px);box-shadow:0 1px 0 #0c0914}
@media (max-width:420px){.pulls{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.sk{width:52px;height:52px}.sk .in{font-size:24px}.slots{gap:5px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">Chiến Thú Hỗn Chiến<small>Thủ trại · Bản offline mod</small></div>
    <div class="res">
      <div class="chip g" title="Vàng"><i></i><span id="rGold">0</span></div>
      <div class="chip d" title="Kim cương"><i></i><span id="rGems">0</span></div>
      <div class="chip b" title="Bóng bắt thú"><i></i><span id="rBalls">0</span></div>
      <div class="chip t" title="Vé pinball"><i></i><span id="rTix">0</span></div>
    </div>
  </header>
  <main class="panel" id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="home">Thủ trại</button>
  <button data-t="team">Đội hình</button>
  <button data-t="gacha">Bắt thú</button>
  <button data-t="pin">Pinball</button>
  <button data-t="mod">Mod</button>
</nav>
<div id="ovRoot"></div>

<script>
(()=>{
// ================= DATA =================
const EL={hoa:{n:'Hỏa',c:'#ff7a45',beats:'moc',fx:'Thiêu đốt: gây sát thương theo thời gian'},
  thuy:{n:'Thủy',c:'#4aa8ff',beats:'hoa',fx:'Làm chậm zombie 35%'},
  moc:{n:'Mộc',c:'#46c97e',beats:'tho',fx:'Mỗi phát trúng hồi chút máu tường'},
  tho:{n:'Thổ',c:'#c99055',beats:'loi',fx:'Đẩy lùi zombie (trừ trùm)'},
  loi:{n:'Lôi',c:'#e8c93a',beats:'thuy',fx:'Sét lan sang 1 zombie gần đó'}};
const ELS=Object.keys(EL);
const RAR=[null,{n:'N',c:'#9aa0ad',m:1},{n:'R',c:'#5aa9ff',m:1.3},{n:'SR',c:'#b77bff',m:1.7},{n:'SSR',c:'#ffc94a',m:2.3}];
const ROLE={dps:{n:'Sát thủ',atk:110,rate:.7,wall:0},tank:{n:'Đỡ đòn',atk:120,rate:1.25,wall:420},sup:{n:'Hỗ trợ',atk:80,rate:1,wall:150}};
const SKCD={meteor:10,beam:9,nova:13,freeze:15,heal:14,rage:16,barrage:9,quake:12};
const SKDESC={
  meteor:m=>`Thả thiên thạch xuống chỗ zombie đông nhất, gây ${Math.round(m*100)}% công lên vùng rộng.`,
  beam:m=>`Bắn tia thẳng dọc đường, gây ${Math.round(m*100)}% công lên mọi zombie trúng tia.`,
  nova:m=>`Nổ toàn bản đồ, gây ${Math.round(m*100)}% công lên mọi zombie.`,
  freeze:m=>`Đóng băng mọi zombie 2,5 giây và gây ${Math.round(m*100)}% công.`,
  heal:m=>`Hồi ${Math.round(m*100)}% máu tường trại.`,
  rage:m=>`Cả đội đánh nhanh gấp đôi trong ${m} giây.`,

  quake:m=>`Động đất gây ${Math.round(m*100)}% công lên mọi zombie và đẩy lùi chúng.`};
const CR=[
 ['keluu','Kê Lửa','🐓','hoa',1,'dps','barrage','Mưa Lông Lửa',.6],
 ['socthan','Sóc Than','🐿️','hoa',1,'sup','meteor','Hạt Dẻ Nổ',2.0],
 ['hoaho','Hỏa Hồ','🦊','hoa',2,'dps','beam','Cửu Vĩ Hỏa',3.0],

 ['viemlong','Viêm Long','🐉','hoa',4,'dps','nova','Long Viêm Bạo',3.2],
 ['thanlong','Hỏa Thần Long','🐲','hoa',4,'tank','meteor','Thiên Hỏa Giáng',6],
 ['bachtuoc','Bạch Tuộc','🐙','thuy',1,'sup','freeze','Phun Mực',.8],
 ['cuabien','Cua Biển','🦀','thuy',1,'tank','quake','Kẹp Sóng',1.2],
 ['thuyquy','Thủy Quy','🐢','thuy',2,'tank','heal','Mai Băng',.2],
 ['haicau','Hải Cẩu','🦭','thuy',2,'dps','barrage','Bóng Nước',.8],
 ['camap','Cá Mập Xanh','🦈','thuy',3,'dps','beam','Hàm Thép',4],
 ['caheo','Cá Heo','🐬','thuy',3,'sup','freeze','Sóng Âm',1.5],
 ['haivuong','Hải Vương Kình','🐳','thuy',4,'tank','nova','Đại Hồng Thủy',3],
 ['banglong','Băng Hải Long','🦕','thuy',4,'sup','freeze','Vĩnh Băng',3],
 ['hungmoc','Hùng Mộc','🐻','moc',1,'tank','quake','Vả Gấu',1.4],
 ['echla','Ếch Lá','🐸','moc',1,'sup','heal','Mưa Xuân',.12],
 ['mocloc','Mộc Lộc','🦌','moc',2,'sup','heal','Xuân Sinh',.2],
 ['thoco','Thỏ Cỏ','🐇','moc',2,'dps','barrage','Cà Rốt Bay',.9],
 ['tinhlinh','Tinh Linh Rừng','🦋','moc',3,'sup','nova','Phấn Hoa',1.8],
 ['gautruc','Gấu Trúc','🐼','moc',3,'tank','rage','Trúc Lâm Trận',7],

 ['khunglong','Khủng Long Đá','🦖','tho',4,'tank','quake','Bạo Long Chấn',5],
].map(([id,n,e,el,r,role,t,sn,m])=>({id,n,e,el,r,role,sk:{t,n:sn,m,cd:SKCD[t]*(1.15-.07*r),d:SKDESC[t](m)}}));
const BY=Object.fromEntries(CR.map(c=>[c.id,c]));
const ZT={

const fmt=n=>{n=Math.floor(n);return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':String(n);};

const rarTag=c=>`<span class="rar" style="--rc:${RAR[c.r].c}">${RAR[c.r].n}</span>`;
const elTag=el=>`<span class="eltag" style="--ec:${EL[el].c}">${EL[el].n}</span>`;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

let lastPulls=[];
function vGacha(){
  const rates=S.mods.ssr?[0,35,25,15,25]:[0,50,32,14,4];
  const canB=n=>inf()||S.balls>=n, canG=n=>inf()||S.gems>=n;
  $('#view').innerHTML=`
  <section class="altar">
    <h2>Bắt Thú</h2>
    <div class="rates">${[1,2,3,4].map(r=>`<span class="rar" style="--rc:${RAR[r].c}">${RAR[r].n} ${rates[r]}%</span>`).join('')}</div>
    <div class="sub">Lượt ×10 chắc chắn có ít nhất 1 thú SR. Bảo hiểm SSR: ${S.pity}/60 lượt.<br>Bắt trùng thì thú đó tăng 1 sao (tối đa 5 sao), đã đủ sao thì đổi thành 800 vàng.</div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="b1" ${canB(1)?'':'disabled'}>Ném 1 bóng</button>
      <button class="btn" id="b10" ${canB(10)?'':'disabled'}>Ném 10 bóng</button>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost sm" id="g1" ${canG(100)?'':'disabled'}>×1 · 100 kim cương</button>
      <button class="btn ghost sm" id="g10" ${canG(900)?'':'disabled'}>×10 · 900 kim cương</button>
    </div>
  </section>
  ${lastPulls.length?`<div class="pulls">${lastPulls.map((p,i)=>{const c=BY[p.id];return `<div class="pull" style="--rc:${RAR[c.r].c};animation-delay:${i*70}ms">${ava(c)}<b>${c.n}</b>${rarTag(c)}<span class="tag">${p.tag}</span></div>`}).join('')}</div>`:'<p class="sub">Thú bắt được sẽ hiện ở đây.</p>'}`;
  const roll=()=>{let x=Math.random()*100,acc=0;for(let r=1;r<=4;r++){acc+=rates[r];if(x<acc)return r;}return 1;};
  const pull=(n,cur)=>{
    if(cur==='b'){if(!canB(n))return;if(!inf())S.balls-=n;}else{const p=n===10?900:100;if(!canG(p))return;if(!inf())S.gems-=p;}
    const rs=[];for(let i=0;i<n;i++){S.pity++;let r=roll();if(S.pity>=60)r=4;if(r===4)S.pity=0;rs.push(r);}
    if(n===10&&Math.max(...rs)<3)rs[9]=3;
    lastPulls=rs.map(r=>{const c=pick(CR.filter(x=>x.r===r));let tag;
      if(!S.owned[c.id]){S.owned[c.id]={lvl:1,stars:1};tag='MỚI!';}
      else if(S.owned[c.id].stars<5){S.owned[c.id].stars++;tag='+1 sao';}
      else{S.gold+=800;tag='+800 vàng';}
      return {id:c.id,tag};});
    save();render();
  };
  $('#b1').onclick=()=>pull(1,'b');$('#b10').onclick=()=>pull(10,'b');$('#g1').onclick=()=>pull(1,'g');$('#g10').onclick=()=>pull(10,'g');
}

// ================= CANVAS FIT =================
function fitCanvas(cv,W,H){
  const wrap=cv.parentElement, r=wrap.getBoundingClientRect(), sc=Math.max(.3,Math.min(r.width/W,r.height/H));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0);return {ctx,sc};

function step(dt){

    if(G.spawnQ.length){if((G.spawnT-=dt)<=0){spawnZ(G.spawnQ.shift());G.spawnT=G.spawnGap;}}

  }

  for(const cr of G.team){
    cr.anim=Math.max(0,cr.anim-dt);
    const cd=S.mods.fastSk?1:cr.c.sk.cd*G.buff.cd;cr.en=Math.min(100,cr.en+dt*100/cd);
    if(cr.en>=100&&S.mods.auto&&wantCast(cr))cast(cr);

      else if(z.T.ranged)G.eproj.push({x:z.x,y:z.y+10,dmg:z.atk});

    if(p.life<=0||p.y<-40||p.x<-20||p.x>W+20)p.done=true;
  }
  G.proj=G.proj.filter(p=>!p.done);
  for(const f of G.fx)f.t-=dt;G.fx=G.fx.filter(f=>f.t>0);

function draw(){

    if(z.burn>0){x.fillStyle='#ff7a45';for(let i=0;i<2;i++){x.globalAlpha=.7;x.beginPath();x.arc(z.x+(Math.random()-.5)*z.size*.6,z.y-z.size*.2-Math.random()*10,2,0,7);x.fill();}x.globalAlpha=1;}
    if(z.slow>0){x.strokeStyle='#4aa8ff';x.lineWidth=1.5;x.beginPath();x.arc(z.x,z.y,z.size*.5,0,7);x.stroke();}
    if(z.hp<z.maxHp){const w=z.T.boss?70:28,y=z.y-z.size*.62;x.fillStyle='#000a';x.fillRect(z.x-w/2,y,w,4);x.fillStyle=z.T.boss?'#ff5d73':'#7be08a';x.fillRect(z.x-w/2,y,w*Math.max(0,z.hp/z.maxHp),4);}
  }
  // wall (palisade)
  const wp=G.wall/G.wallMax;
  for(let i=0;i<W;i+=14){const h=24+((i*7)%5);x.fillStyle=wp>.5?'#8a5a32':wp>.2?'#7a4a2a':'#5e3520';x.fillRect(i+1,WALL_Y-h+20,12,h);x.beginPath();x.moveTo(i+1,WALL_Y-h+20);x.lineTo(i+7,WALL_Y-h+12);x.lineTo(i+13,WALL_Y-h+20);x.fill();x.fillStyle='#0003';x.fillRect(i+9,WALL_Y-h+20,4,h);}
  x.fillStyle='#5a3a20';x.fillRect(0,WALL_Y+4,W,5);
  // critters
  for(const cr of G.team){
    const col=EL[cr.c.el].c;
    x.fillStyle='#0005';x.beginPath();x.ellipse(cr.x,cr.y+18,24,8,0,0,7);x.fill();
    x.strokeStyle=col;x.lineWidth=3;x.globalAlpha=.5+.5*(cr.en/100);x.beginPath();x.ellipse(cr.x,cr.y+18,25,9,0,0,7);x.stroke();x.globalAlpha=1;
    if(G.rage>0){x.fillStyle='#ff5d7340';x.beginPath();x.arc(cr.x,cr.y,28+Math.sin(G.t*20)*3,0,7);x.fill();}
    if(cr.en>=100){x.fillStyle=col+'44';x.beginPath();x.arc(cr.x,cr.y,26,0,7);x.fill();}
    const s=34*(1+cr.anim*.6);x.font=`${s}px ${EMO}`;x.fillStyle='#fff';x.fillText(cr.c.e,cr.x,cr.y+Math.sin(G.t*3+cr.x)*2);
  }
  // projectiles
  for(const p of G.proj){const c=EL[p.el].c;x.fillStyle=c;x.globalAlpha=.35;x.beginPath();x.arc(p.x-p.vx*.015,p.y-p.vy*.015,p.crit?7:5,0,7);x.fill();x.globalAlpha=1;x.beginPath();x.arc(p.x,p.y,p.crit?5:3.5,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,1.5,0,7);x.fill();}
  // effects
  for(const f of G.fx){const a=f.t/f.d;
    if(f.k==='ring'){x.strokeStyle=f.col;x.globalAlpha=a;x.lineWidth=4;x.beginPath();x.arc(f.x,f.y,f.r1-(f.r1-f.r0)*a,0,7);x.stroke();}
    else if(f.k==='beam'){x.globalAlpha=a;const g=x.createLinearGradient(f.x-34,0,f.x+34,0);g.addColorStop(0,f.col+'00');g.addColorStop(.5,'#fff');g.addColorStop(1,f.col+'00');x.fillStyle=g;x.fillRect(f.x-34,0,68,SLOT_Y-20);x.fillStyle=f.col;x.fillRect(f.x-10,0,20,SLOT_Y-20);}
    else if(f.k==='flash'){x.globalAlpha=a*.45;x.fillStyle=f.col;x.fillRect(0,0,W,WALL_Y);}
    else if(f.k==='heal'){x.globalAlpha=a*.5;x.fillStyle='#5fe39a';x.fillRect(0,WALL_Y-30,W,50);}
    else if(f.k==='bolt'){x.globalAlpha=a;x.strokeStyle='#fff4a0';x.lineWidth=2;x.beginPath();x.moveTo(f.x1,f.y1);const mx=(f.x1+f.x2)/2+(Math.random()-.5)*20,my=(f.y1+f.y2)/2+(Math.random()-.5)*20;x.lineTo(mx,my);x.lineTo(f.x2,f.y2);x.stroke();}
    else if(f.k==='meteor'){const p=1-a;x.globalAlpha=1;x.fillStyle=f.col;x.beginPath();x.arc(f.x+60*(1-p),f.y-200*(1-p),14,0,7);x.fill();x.fillStyle='#fff8';x.beginPath();x.arc(f.x+60*(1-p),f.y-200*(1-p),7,0,7);x.fill();}
    x.globalAlpha=1;}
  for(const q of G.parts){x.globalAlpha=q.t/.5;x.fillStyle=q.col;x.fillRect(q.x,q.y,q.sz,q.sz);}x.globalAlpha=1;
  for(const t of G.txt){x.globalAlpha=Math.min(1,t.t*2);x.font=`800 ${t.size}px "Baloo 2",sans-serif`;x.lineWidth=3;x.strokeStyle='#000';x.strokeText(t.s,t.x,t.y);x.fillStyle=t.col;x.fillText(t.s,t.x,t.y);}
  x.globalAlpha=1;
  if(G.banner){const b=G.banner,a=Math.min(1,b.t*2);x.globalAlpha=a;x.fillStyle='#000a';x.fillRect(0,200,W,b.sub?62:48);
    x.font='800 28px "Baloo 2",sans-serif';x.fillStyle=b.col||'#ffc94a';x.fillText(b.text,W/2,224);
    if(b.sub){x.font='600 12px "Be Vietnam Pro",sans-serif';x.fillStyle='#fff';x.fillText(b.sub,W/2,250);}x.globalAlpha=1;}
  if(G.state==='break'&&G.wave===0){x.font='800 18px "Baloo 2",sans-serif';x.fillStyle='#fff';x.fillText('Zombie đang tới…',W/2,300);}
  if(G.paused){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.font='800 30px "Baloo 2",sans-serif';x.fillStyle='#fff';x.fillText('Tạm dừng',W/2,H/2);}
  x.restore();
}
function hud(){
  const wl=G.mode==='stage'?`Đợt ${Math.max(1,G.wave)}/${WAVES}`:`Đợt ${Math.max(1,G.wave)} · Kỷ lục ${S.best}`;
  $('#bWave').textContent=wl;
  $('#bWall').style.width=(G.wall/G.wallMax*100)+'%';$('#bWallN').textContent=(S.mods.god?'Bất tử · ':'')+fmt(G.wall)+' / '+fmt(G.wallMax);
  $('#bGold').textContent='+'+fmt(G.gold);
  G.team.forEach((cr,i)=>{const b=G.skBtns[i];b.style.setProperty('--p',cr.en.toFixed(0));b.classList.toggle('ready',cr.en>=100);});
}
function frame(ts){
  if(!G||G.dead)return;
  const g=G,raw=Math.min(.05,g.last?(ts-g.last)/1000:0);g.last=ts;
  if(!g.paused&&g.state!=='buff'&&g.state!=='end'){let t=raw*S.mods.speed;while(t>0&&G===g&&g.state!=='end'&&g.state!=='buff'){const d=Math.min(t,1/60);step(d);t-=d;}}
  if(G!==g||g.dead)return;
  draw();hud();requestAnimationFrame(frame);
}

// ================= PINBALL =================
const PW=360,PH=620;
let P=null;
function startPinball(){
  const segs=[[12,620,12,150],[12,150,60,40],[60,40,300,40],[300,40,348,150],[348,150,348,620],[12,440,104,498],[348,440,256,498],[12,380,40,400],[348,380,320,400]];
  P={segs,bump:[{x:110,y:190,r:24,big:1,lit:0,fl:0},{x:250,y:190,r:24,big:1,lit:0,fl:0},{x:180,y:280,r:26,big:1,lit:0,fl:0},{x:75,y:330,r:15,fl:0},{x:285,y:330,r:15,fl:0},{x:180,y:390,r:12,fl:0}],
    star:{x:180,y:105,r:12,cd:0},fl:[{px:110,py:505,a:.5,rest:.5,up:-.45,w:0,on:false,dir:-1},{px:250,py:505,a:Math.PI-.5,rest:Math.PI-.5,up:Math.PI+.45,w:0,on:false,dir:1}],
    ball:null,balls:3,score:0,mult:1,gems:0,wait:.6,last:0,dead:false,over:false,txt:[]};
  $('#ovRoot').innerHTML=`<div class="arena" id="arena">
    <div class="bhud"><div class="bl"><b>Pinball</b><span id="pBalls"></span></div><div style="flex:1"></div><div class="bgold" id="pScore">0</div></div>
    <div class="cv"><canvas id="pcv"></canvas></div>
    <div class="flip"><button id="fL">◀ Trái</button><button id="fR">Phải ▶</button></div>
    <div class="ctrl"><button class="btn red sm" id="pQuit">Kết thúc</button></div></div>`;
  const cv=$('#pcv');P.fit=()=>{const r=fitCanvas(cv,PW,PH);P.ctx=r.ctx;};P.fit();window.addEventListener('resize',P.fit);P.ro=new ResizeObserver(()=>P&&P.fit());P.ro.observe(cv.parentElement);
  const set=(i,v)=>{P.fl[i].on=v;$(i?'#fR':'#fL').classList.toggle('on',v);};
  [['#fL',0],['#fR',1]].forEach(([s,i])=>{const b=$(s);b.onpointerdown=e=>{e.preventDefault();set(i,true);};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>set(i,false);});
  cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();const i=e.clientX-r.left<r.width/2?0:1;set(i,true);const up=()=>{set(i,false);window.removeEventListener('pointerup',up);};window.addEventListener('pointerup',up);};
  P.key=e=>{const d=e.type==='keydown';if(['ArrowLeft','z','Z'].includes(e.key)){set(0,d);e.preventDefault();}if(['ArrowRight','m','M','/'].includes(e.key)){set(1,d);e.preventDefault();}};
  window.addEventListener('keydown',P.key);window.addEventListener('keyup',P.key);
  $('#pQuit').onclick=()=>pinEnd();
  requestAnimationFrame(pframe);
}
function closePin(){if(!P)return;P.dead=true;window.removeEventListener('resize',P.fit);P.ro.disconnect();window.removeEventListener('keydown',P.key);window.removeEventListener('keyup',P.key);P=null;$('#ovRoot').innerHTML='';render();}
function pts(n,x,y){const v=n*P.mult;P.score+=v;P.txt.push({x,y,s:'+'+v,t:.7});if(P.txt.length>20)P.txt.shift();}
function collideSeg(b,ax,ay,bx,by,rad,rest,sv){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=((b.x-ax)*dx+(b.y-ay)*dy)/l2;t=Math.max(0,Math.min(1,t));
  const px=ax+t*dx,py=ay+t*dy;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny);
  if(d>=rad||d===0)return false;nx/=d;ny/=d;b.x=px+nx*rad;b.y=py+ny*rad;
  const s=sv?sv(px,py):{x:0,y:0};const rvx=b.vx-s.x,rvy=b.vy-s.y,vn=rvx*nx+rvy*ny;
  if(vn<0){b.vx-=(1+rest)*vn*nx;b.vy-=(1+rest)*vn*ny;}return true;
}
function pstep(dt){
  for(const f of P.fl){const tg=f.on?f.up:f.rest,old=f.a,sp=22*dt;f.a+=Math.max(-sp,Math.min(sp,tg-f.a));f.w=(f.a-old)/dt;}
  for(const bm of P.bump)bm.fl=Math.max(0,bm.fl-dt);P.star.cd=Math.max(0,P.star.cd-dt);
  for(const t of P.txt){t.t-=dt;t.y-=30*dt;}P.txt=P.txt.filter(t=>t.t>0);
  if(!P.ball){if(P.balls>0&&(P.wait-=dt)<=0)P.ball={x:180+(Math.random()-.5)*60,y:70,vx:(Math.random()-.5)*160,vy:0,r:8};return;}
  const b=P.ball;b.vy+=900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(const s of P.segs)collideSeg(b,s[0],s[1],s[2],s[3],b.r,.45);
  for(const f of P.fl){const tx=f.px+62*Math.cos(f.a),ty=f.py+62*Math.sin(f.a);
    collideSeg(b,f.px,f.py,tx,ty,b.r+5,.25,(px,py)=>({x:-f.w*(py-f.py),y:f.w*(px-f.px)}));}
  for(const bm of P.bump){const dx=b.x-bm.x,dy=b.y-bm.y,d=Math.hypot(dx,dy);if(d<bm.r+b.r&&d>0){const nx=dx/d,ny=dy/d;b.x=bm.x+nx*(bm.r+b.r);b.y=bm.y+ny*(bm.r+b.r);const vn=b.vx*nx+b.vy*ny;b.vx-=vn*nx;b.vy-=vn*ny;const boost=Math.max(420,Math.abs(vn)*1.1);b.vx+=nx*boost;b.vy+=ny*boost;
    if(bm.fl<=0){pts(bm.big?100:50,bm.x,bm.y-bm.r);if(bm.big&&!bm.lit){bm.lit=1;if(P.bump.filter(q=>q.big).every(q=>q.lit)){P.mult++;P.bump.forEach(q=>q.lit=0);P.txt.push({x:180,y:330,s:'Hệ số ×'+P.mult,t:1.2});}}}bm.fl=.12;}}
  const st=P.star;if(st.cd<=0&&Math.hypot(b.x-st.x,b.y-st.y)<st.r+b.r){st.cd=1;P.gems+=5;pts(500,st.x,st.y-16);b.vy=Math.abs(b.vy)*.8+60;}
  const sp=Math.hypot(b.vx,b.vy);if(sp>1300){b.vx*=1300/sp;b.vy*=1300/sp;}
  if(b.y>PH+20||b.x<0||b.x>PW){P.ball=null;P.balls--;P.wait=.8;if(P.balls<=0)pinEnd();}
}
function pdraw(){
  const x=P.ctx;const g=x.createLinearGradient(0,0,0,PH);g.addColorStop(0,'#2a1b4f');g.addColorStop(1,'#120c24');x.fillStyle=g;x.fillRect(0,0,PW,PH);
  x.fillStyle='#ffffff08';for(let i=0;i<PW;i+=24)for(let j=0;j<PH;j+=24)x.fillRect(i,j,2,2);
  x.strokeStyle='#c58cff';x.lineWidth=5;x.lineCap='round';for(const s of P.segs){x.beginPath();x.moveTo(s[0],s[1]);x.lineTo(s[2],s[3]);x.stroke();}
  x.textAlign='center';x.textBaseline='middle';
  for(const bm of P.bump){x.fillStyle=bm.fl>0?'#fff':bm.lit?'#ffc94a':bm.big?'#ff5d73':'#7ee0ff';x.beginPath();x.arc(bm.x,bm.y,bm.r,0,7);x.fill();x.fillStyle='#0004';x.beginPath();x.arc(bm.x,bm.y,bm.r*.55,0,7);x.fill();if(bm.big){x.font='800 12px "Baloo 2",sans-serif';x.fillStyle='#fff';x.fillText('100',bm.x,bm.y+1);}}
  const st=P.star;x.save();x.translate(st.x,st.y);x.rotate(Math.PI/4);x.fillStyle=st.cd>0?'#7ee0ff55':'#7ee0ff';x.fillRect(-9,-9,18,18);x.restore();
  for(const f of P.fl){x.strokeStyle='#ffc94a';x.lineWidth=12;x.beginPath();x.moveTo(f.px,f.py);x.lineTo(f.px+62*Math.cos(f.a),f.py+62*Math.sin(f.a));x.stroke();}
  if(P.ball){const b=P.ball;const gg=x.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r);gg.addColorStop(0,'#fff');gg.addColorStop(1,'#9a9ab0');x.fillStyle=gg;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();}
  for(const t of P.txt){x.globalAlpha=Math.min(1,t.t*2);x.font='800 16px "Baloo 2",sans-serif';x.fillStyle='#ffc94a';x.fillText(t.s,t.x,t.y);}x.globalAlpha=1;
  x.font='600 12px "Be Vietnam Pro",sans-serif';x.fillStyle='#a39bc2';x.fillText('Hệ số ×'+P.mult+' · Kim cương +'+P.gems,PW/2,590);
  $('#pScore').textContent=fmt(P.score);$('#pBalls').textContent='Bóng còn: '+Math.max(0,P.balls);
}
function pframe(ts){
  if(!P||P.dead)return;const p=P,raw=Math.min(.033,p.last?(ts-p.last)/1000:0);p.last=ts;
  if(!p.over){const n=8;for(let i=0;i<n&&P===p&&!p.over;i++)pstep(raw/n);}
  if(P!==p||p.dead)return;pdraw();requestAnimationFrame(pframe);
}
function pinEnd(){
  if(!P||P.over)return;P.over=true;
  const gold=Math.floor(P.score/4)*S.mods.goldMul,ball=P.score>=20000?1:0;
  S.gold+=gold;S.gems+=P.gems;S.balls+=ball;save();
  const d=document.createElement('div');d.className='over';
  d.innerHTML=`<div class="box"><h2 style="color:var(--gold)">${fmt(P.score)} điểm</h2><div>+${fmt(gold)} vàng · +${P.gems} kim cương${ball?' · +1 bóng bắt thú':''}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="pAgain" ${inf()||S.tix>0?'':'disabled'}>Chơi tiếp · 1 vé</button><button class="btn ghost" id="pBack">Về trại</button></div></div>`;
  $('#arena').appendChild(d);
  $('#pBack').onclick=closePin;
  $('#pAgain').onclick=()=>{if(!inf()){if(S.tix<1)return;S.tix--;}save();closePin();startPinball();};
}

// ================= BOOT =================
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;confirmReset=false;save();render();});
const start=d=>{load(d);render();};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
